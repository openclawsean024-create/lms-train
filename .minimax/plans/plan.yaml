         ```
         全部要 200/201,任何 4xx/5xx 是 FAIL。

      5. **視覺驗證 (用 browser tool 開啟每頁)**:
         - 載入每頁 → 截圖到 `screenshots/verify-*.png`
         - 確認:
           - 背景是米白 (--paper, #F5EFE2),不是白
           - 主文字是深黑 (--ink, #0E0E0E),不是預設黑
           - 標題字型是 serif (DM Serif Display 或 Noto Serif TC),不是 sans-serif
           - 有看到浮水印 (右上角紅印章 CONCEPT · 設計提案)
           - 章節標有「第 〇 課」「第 〇 章」中式編號
           - 沒有任何「藍色」「漸層」「膠囊圓角」SaaS 風
         - 對每張截圖給 1-2 句視覺判斷

      6. **git log** 有 T2 commit。

      ## 輸出
      對每頁給 PASS/FAIL + 證據,最後整體 VERDICT。
      FAIL 必須指出哪一頁缺什麼、該怎麼修。

  # === T3: M7 證據 + 4 張截圖 ===
  - id: m7-evidence
    title: 'M7 證據文件 + 4 張截圖 + SPEC 驗收 audit table'
    assigned_to: coder
    depends_on: [page-redesign]
    verified_by: verifier
    max_retries: 1
    prompt: |
      你在 /Users/sean/.minimax/workspace/lms-train-m7/ 這個 worktree。
      T1 + T2 已完成,所有 5 頁都是拾光風格,功能完整。

      你的任務:寫 **M7-EVIDENCE.md**,這是 SPEC 終點里程碑的證據。

      ## 必做事項

      1. **跑完整 SPEC §驗收標準 的 8 項** (從 M6-EVIDENCE.md 抄格式,但重跑 T2 之後的版本):
         - GET /
         - GET /c/intro-nextjs
         - GET /api/courses
         - POST /api/courses
         - POST /api/courses/intro-nextjs/submit
         - GET /api/courses/intro-nextjs/stats
         - GET /admin/c/intro-nextjs/stats
         - GET /api/courses/nonexistent/stats (預期 404)

         每項記錄: HTTP status、response size、關鍵字串 grep (e.g. "Next.js 入門介紹"、"拾光")。

      2. **4 張精選截圖** (用 browser tool 或 webapp-testing skill):
