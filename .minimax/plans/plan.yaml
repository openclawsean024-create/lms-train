version: 1
plan:
  name: 'lms-train M7 收尾 + 拾光風格重製'
  max_concurrency: 2
  max_consecutive_failures: 2
  max_cycles: 8
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  # === T1: 設計系統落地 (基礎設施,後續所有頁面的合約) ===
  - id: design-system
    title: '建立拾光設計系統 (字型 + tokens + .tenet-* 元件)'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    prompt: |
      你在 /Users/sean/.minimax/workspace/lms-train-m7/ 這個 worktree 工作。
      這是從 https://github.com/openclawsean024-create/lms-train clone 下來的,
      npm install 已完成,typecheck/build 皆綠。

      **先讀 /Users/sean/.minimax/workspace/lms-train-m7/DESIGN-SYSTEM.md**
      這是整個 M7 的單一合約文件,所有顏色/字型/排版/元件規範都在裡面。

      你的任務:把 DESIGN-SYSTEM.md 落地到程式碼,只做基礎設施,**不動任何 page.tsx**。

      ## 必做事項

      1. **app/layout.tsx** — 用 `next/font/google` 載入 6 個字型:
         - DM_Serif_Display (display)
         - Noto_Serif_TC (tc, weight 400/500/700)
         - ZCOOL_XiaoWei (handwrite)
         - Long_Cang (stamp)
         - Special_Elite (mono-stamp)
         - JetBrains_Mono (mono, weight 400/500)
         每個都加 `variable: --font-*`,在 `<body>` 套上所有 variable class。
         metadata 改成 `title: 'LMS Train · 拾光提案'` 與合適的 description。

      2. **app/globals.css** — 完整重寫成兩層:
         - **Layer A (頂部)**: `:root` 內所有 CSS 變數,照 DESIGN-SYSTEM §2。
         - **Layer B (中段)**: 全域重置 (`html`, `body` 用 paper 底 + ink 字 + Noto Serif TC)。
         - **Layer C (下段)**: `.tenet-*` 共用元件,照 DESIGN-SYSTEM §5
           (chapter / stamp / footer / btn / input / textarea / card / corner / list / label)。
         - **保留所有舊的頁面專屬 class (`.course-list`, `.video-wrap`, `.btn-primary`, `.score-circle`, `.stat-card`, `.result-item` 等) 完全不動** —
           這樣 Task 2 才有空間做 incremental migration,中途 build 不會壞。

      3. **app/page.module.css** — 新增空殼,等 Task 2 寫首頁時填。
         (但 globals.css 不 import 任何 module,只放全域的東西。)

      4. **驗證**:
         - `npm run typecheck` 0 錯
         - `npm run build` 成功
         - `globals.css` 大小 < 14KB
         - 啟動 dev server (`npm run dev` 背景跑) → curl `http://localhost:3000/` 仍 200 OK
         - 首頁雖然視覺還沒換,但不應該壞。確認 5 個原有 class 還在,字型開始載入。

      5. **git commit**:
         ```
         git add -A
         git commit -m "M7-T1: 拾光設計系統 foundation (字型 + tokens + .tenet-* 元件)

         - app/layout.tsx: 6 個 next/font 字型 (DM Serif Display / Noto Serif TC /
           ZCOOL XiaoWei / Long Cang / Special Elite / JetBrains Mono)
         - app/globals.css: 重寫成 tokens + .tenet-* 共用元件層,
           保留所有舊的頁面專屬 class 供 incremental migration
         - DESIGN-SYSTEM.md: 設計合約 (本檔由 orchestrator 預先建立)
         "
         ```

      ## 絕對不要做
      - ❌ 改任何 page.tsx (Task 2 的工作)
      - ❌ 移除任何舊 CSS class
      - ❌ 改 lib/db.ts 或任何 API route
      - ❌ 用 `<link>` 寫字型,一定要 `next/font/google`
      - ❌ 在 globals.css 寫 CJK 字串到 `content:"..."` (用 CSS hex escape 或避免)

      ## 交付回報
      列出:
      - `app/layout.tsx` 改動行數
      - `app/globals.css` 最終 size (bytes) 與 layer 結構
      - 字型載入成功的證據 (curl 首頁 source 看 `<style>` 內有 font-family 引用)
      - typecheck/build 結果
      - commit hash
    verify_prompt: |
      你在 /Users/sean/.minimax/workspace/lms-train-m7/ 這個 worktree。
      獨立檢查 Task 1 的交付,不要相信 worker 自述。

      ## 檢查清單
      1. **app/layout.tsx**:
         - 必須有 6 個 `next/font/google` import
         - 必須有 6 個變數宣告 (variable: --font-*)
         - `<body>` 必須套上所有 variable class
         - 沒有任何 `<link rel="stylesheet" href="https://fonts...">`

      2. **app/globals.css**:
         - `:root` 內必須有 DESIGN-SYSTEM §2 列出的所有 CSS 變數
           (--ink, --paper, --paper-2, --paper-3, --gold, --gold-soft, --gold-bg,
            --stamp, --stamp-soft, --rule, --rule-soft, --rule-faint, --ok, --err,
            --font-display, --font-tc, --font-handwrite, --font-stamp,
            --font-mono-stamp, --font-mono, --fs-*)
         - 必須有 `.tenet-*` 共用元件 (至少: chapter, stamp, footer, btn, input, card)
         - **所有舊 class 必須保留** (grep 至少要找到: .course-list, .video-wrap,
           .btn-primary, .score-circle, .stat-card, .result-item, .qs-bar)
         - file size < 14KB

      3. **執行驗證**:
         - `cd /Users/sean/.minimax/workspace/lms-train-m7 && npm run typecheck` → 0 錯
         - `npm run build` → 成功
         - `npm run dev` 背景啟動,curl `http://localhost:3000/` → 200 OK
         - curl 拿回的 HTML 內 grep `--font-` 出現 6 次 (字型 variables 已套用)

      4. **git log** 確認有 T1 commit,訊息符合 prompt 要求。

      ## 輸出
      對每項給 PASS/FAIL,FAIL 時說明確切缺什麼。
      最後給整體 VERDICT: PASS | FAIL | PARTIAL。

  # === T2: 5 個頁面全部重製 (Task 1 必須先 PASS) ===
  - id: page-redesign
    title: '5 個頁面全部套上拾光風格 (列表/作答/結果/管理/統計)'
    assigned_to: coder
    depends_on: [design-system]
    verified_by: verifier
    max_retries: 2
    prompt: |
      你在 /Users/sean/.minimax/workspace/lms-train-m7/ 這個 worktree。
      設計系統已由 Task 1 建立 (globals.css tokens + .tenet-* 元件 + 字型)。

      **先讀 /Users/sean/.minimax/workspace/lms-train-m7/DESIGN-SYSTEM.md §6**
      裡面有每個頁面的細節規範。請嚴格遵守。

      ## 必做事項 (5 個頁面 + 配套 CSS module)

      1. **app/page.tsx** (課程列表) → 用 `app/page.module.css`
      2. **app/c/[id]/page.tsx** (學員看課+答題) → `app/c/[id]/page.module.css`
      3. **app/c/[id]/result/[subId]/page.tsx** (結果) → `app/c/[id]/result/[subId]/page.module.css`
      4. **app/admin/page.tsx** (老師建課) → `app/admin/page.module.css`
      5. **app/admin/c/[id]/stats/page.tsx** (統計儀表板) → `app/admin/c/[id]/stats/page.module.css`

      每個頁面:
      - 改寫 JSX 用 `.tenet-*` 共用元件 (來自 globals.css)
      - 章節標用 `.tenet-chapter` 結構 (中式書卷感)
      - 右上角自動帶浮水印 `.tenet-stamp` (用 globals.css 寫成 fixed positioned,所有頁面都有)
      - 頁尾帶 `.tenet-footer` (印章字 + 設計提案字樣)
      - 頁面專屬樣式寫在 `page.module.css`,從 globals.css import token (`var(--*)`)
      - **.tenet-stamp 不在每頁 JSX 寫 — 改在 globals.css 用 `body::after` 或 fixed positioned body-level element 統一加,
        否則 5 個頁面都加會亂。**(這是個架構決定,請這樣做。)

      **每頁 JSX 結構範本**:
      ```tsx
      <main className="tenet-container tenet-container--narrow">
        <div className="tenet-chapter">
          <span className="tenet-chapter-num">第 〇 課</span>
          <span className="tenet-chapter-title">{page-title}</span>
        </div>
        ... 內容 ...
        <footer className="tenet-footer">— LMS Train · 拾光設計提案 · M7 —</footer>
      </main>
      ```

      ## 完成後的清理

      改完 5 頁後,從 `app/globals.css` **移除該頁用不到的舊 class**:
      - `.course-list`, `.course-card`, `.course-title`, `.course-desc`, `.course-meta` (首頁用過)
      - `.video-wrap` (學員看課用過)
      - `.form`, `.field`, `.questions-fs`, `.question-block`, `.question-header`,
        `.choices`, `.choice-row`, `.btn-link`, `.submit-row`, `.answered-count` (admin)
      - `.result-summary`, `.score-circle`, `.score-num`, `.score-label`,
        `.score-detail`, `.score-main`, `.score-email`, `.score-time`,
        `.result-list`, `.result-item`, `.result-status`, `.result-q`,
        `.result-answer`, `.ans-correct`, `.ans-wrong` (result)
      - `.stats-summary`, `.stat-card`, `.stat-label`, `.stat-num`, `.stat-unit`,
        `.question-stats`, `.question-stat`, `.qs-header`, `.qs-label`,
        `.qs-rate`, `.qs-prompt`, `.qs-bar`, `.qs-bar-fill`, `.qs-meta` (stats)
      - 保留: `.demo-note` (首頁還要用,但改寫成 .tenet-demo), `.hint` (或刪除),
        `.back` (或併入 .tenet-back), `.nav` (或併入 .tenet-nav)
      - 保留: `.btn-primary` → 改名 `.tenet-btn` 之前的過渡,**全部移除**並改用 .tenet-btn
      - 保留: `.btn-secondary` 移除,改用 .tenet-btn--ghost
      - 保留: `.msg-ok`, `.msg-err` 改寫成 .tenet-msg--ok / .tenet-msg--err
      - 保留: `.hint-text` 改寫或移除
      - 保留: `.container`, `.subtitle`, `.empty`, `.section`, `.section-title`, `.h1`
        全部移除,改用 .tenet-container 與 .tenet-chapter

      最後 globals.css 只剩:
      - 頂部 `:root` tokens
      - 中段全域 reset
      - 下段 .tenet-* 元件
      - 大小最終 < 12KB

      ## 功能性 100% 保留
      改完後**所有原功能必須正常**:
      - `/` 列課程、點進課程
      - `/c/[id]` 看 YouTube、輸入 Email、答題、提交、跳到結果頁
      - `/c/[id]/result/[subId]` 看分數與對錯
      - `/admin` 建課表單能新增/刪除題目、提交成功
      - `/admin/c/[id]/stats` 看 KPI 卡 + 各題答對率
      - 8 個 SPEC §驗收的 API endpoint 都還能 curl 通過

      ## 驗證流程

      ```bash
      cd /Users/sean/.minimax/workspace/lms-train-m7
      npm run typecheck              # 0 錯
      npm run build                  # 成功
      npm run dev &                  # 背景啟動
      sleep 5
      # 跑 SPEC 驗收的 8 個 curl
      curl -sS -o /dev/null -w "%{http_code}\n" http://localhost:3000/
      curl -sS -o /dev/null -w "%{http_code}\n" http://localhost:3000/c/intro-nextjs
      curl -sS http://localhost:3000/api/courses | head -c 200
      curl -sS -X POST http://localhost:3000/api/courses -H 'Content-Type: application/json' \
        -d '{"title":"拾光測試","description":"d","youtubeUrl":"https://www.youtube.com/embed/xxx","questions":[{"id":"q1","prompt":"a","choices":["a","b","c","d"],"answerIndex":0},{"id":"q2","prompt":"a","choices":["a","b","c","d"],"answerIndex":0},{"id":"q3","prompt":"a","choices":["a","b","c","d"],"answerIndex":0}]}'
      curl -sS -X POST http://localhost:3000/api/courses/intro-nextjs/submit -H 'Content-Type: application/json' \
        -d '{"email":"test@x.com","answers":[0,0,0]}'
      curl -sS -o /dev/null -w "%{http_code}\n" http://localhost:3000/admin/c/intro-nextjs/stats
      # 截圖 5 頁 (用 webapp-testing skill 或 playwright CLI,或 Browser tool)
      ```
      截圖存到 `screenshots/` 目錄:
      - `screenshots/01-home.png` (/)
      - `screenshots/02-course.png` (/c/intro-nextjs)
      - `screenshots/03-admin.png` (/admin)
      - `screenshots/04-stats.png` (/admin/c/intro-nextjs/stats)
      - `screenshots/05-result.png` (任一 submission 的 result page;需先 submit 一份)

      ## git commit
      ```
      git add -A
      git commit -m "M7-T2: 5 頁面套上拾光風格 (CSS modules + .tenet-*)

      - app/page.tsx + page.module.css: 課程列表
      - app/c/[id]/page.tsx + page.module.css: 學員看課+答題
      - app/c/[id]/result/[subId]/page.tsx + page.module.css: 結果
      - app/admin/page.tsx + page.module.css: 老師建課
      - app/admin/c/[id]/stats/page.tsx + page.module.css: 統計儀表板
      - app/globals.css: 移除所有頁面專屬舊 class,只剩 tokens + .tenet-* + 字型
      - screenshots/: 5 張驗證截圖
      "
      ```

      ## 交付回報
      列出:
      - 每個頁面改了什麼
      - globals.css 最終 size 與移除的 class 數
      - 8 個 curl 結果 (status code)
      - 5 張截圖路徑
      - commit hash
    verify_prompt: |
      你在 /Users/sean/.minimax/workspace/lms-train-m7/ 這個 worktree。
      獨立檢查 Task 2 的交付。**不要相信 worker 自述,要用 curl/grep/screenshot 親自驗證。**

      ## 必須 PASS 的檢查

      1. **5 個 page.tsx 都改成 .tenet-* 架構**:
         - 讀 5 個 page.tsx,確認有 `<div className="tenet-chapter">` 或等效章節標結構
         - 確認有引用 `.tenet-container` 或同等的頁面容器 class
         - 確認沒有任何剩餘的舊 class (`.course-list`, `.video-wrap`, `.btn-primary`,
           `.score-circle`, `.stat-card`, `.result-item`, `.form`, `.field` 等)

      2. **5 個 page.module.css 都存在** 且內含合理樣式 (用 `find` 確認檔案存在)

      3. **globals.css 已清乾淨**:
         - grep 確認移除所有頁面專屬舊 class
         - 確認 `--*` tokens 與 `.tenet-*` 都在
         - file size < 12KB

      4. **功能完整性 (curl 實測)**:
         ```
         cd /Users/sean/.minimax/workspace/lms-train-m7
         npm run typecheck
         npm run build
         npm run dev &; sleep 5
         curl -sS -o /dev/null -w "/=%{http_code}\n" http://localhost:3000/
         curl -sS -o /dev/null -w "/c/intro-nextjs=%{http_code}\n" http://localhost:3000/c/intro-nextjs
         curl -sS -o /dev/null -w "/api/courses=%{http_code}\n" http://localhost:3000/api/courses
         curl -sS -o /dev/null -w "/admin=%{http_code}\n" http://localhost:3000/admin
         curl -sS -o /dev/null -w "/admin/c/intro-nextjs/stats=%{http_code}\n" http://localhost:3000/admin/c/intro-nextjs/stats
